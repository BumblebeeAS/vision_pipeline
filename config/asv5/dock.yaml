# ASV5 dock vision pipeline (launch/robotx/dock.launch.py).
#
# Two independently toggled stages, each with its own lifecycle manager:
#   /asv5/dock_bev/manage_nodes BEV dock pose (dock_lidar_pose_estimator_node)
#   /asv5/dockwin/manage_nodes  dock window YOLO (dockwin_yolo_node)
# Call with lifecycle_msgs/srv/ChangeState, transition id 3 (activate) or 4
# (deactivate).

/asv5/dock_bev/lifecycle_manager_node:
  ros__parameters:
    node_names:
      - dock_lidar_pose_estimator_node
    wait_timeout_sec: 1.0

/asv5/dockwin/lifecycle_manager_node:
  ros__parameters:
    node_names:
      - dockwin_yolo_node
    wait_timeout_sec: 1.0


# 2D lidar BEV dock pose (dock_lidar_pose_estimator_node).
/**/dock_lidar_pose_estimator_node:
  ros__parameters:
    # Frames / topics (defaults match the node).
    target_frame_id: asv5/base_link
    input_bev_topic: /asv5/bev
    # Template match directly on the BEV (no YOLO): full search every frame.
    camera_info_topic: /asv5/bev/camera_info
    debug_image_topic: /asv5/bev_detections/image
    pose_topic: /asv5/dock/pose
    pose_frame_id: asv5/base_link
    # Sim selects the RX26 template/dims; these are the real dock_single
    # defaults. template_path is left to the node so it follows use_sim.
    use_sim: false
    # Starts inactive; activate via /asv5/dock_bev/manage_nodes.
    activate_on_start: false
    dock_length_m: 2.5
    dock_width_m: 2.5
    # Must equal the bev_node scale (0.02 m/px; camera_info fx = 50/scale
    # = 2500). If this is wrong the nominal template size and the
    # pixel->metre pose conversion are both wrong.
    bev_scale: 0.02
    # TM_CCOEFF_NORMED correlation, range -1..1 (higher is better).
    match_threshold: 0.40
    # BEV is an orthographic metric projection, so dock pixel size is fixed by
    # dock dims / bev_scale. Measured best fit on the recorded dock BEV sits at
    # ~1.10-1.15x, so search wide enough to cover dock-size error instead of
    # clamping at 1.05.
    min_template_scale: 1.0
    max_template_scale: 1.1
    template_scale_step: 0.05
    coarse_angle_step_deg: 10.0
    fine_angle_step_deg: 0.5
    # Full search runs on the BEV resized by this factor (0..1]; lower is
    # faster but coarser.
    search_downsample: 0.5
    # 3D template marker on <pose_topic>/template_marker (CUBE_LIST in
    # pose_frame_id). Must match bev_node's bev_z_min / bev_z_max (os0_filter
    # min_height / max_height) so template grey levels map to true heights.
    bev_z_min: -0.65
    bev_z_max: 0.5
    template_marker_stride: 2

# BEV dock YOLO (dock_bev_yolo_node). Off by default and not in the dock_bev
# manager's node_names; activate directly with ros2 lifecycle set.
/**/dock_bev_yolo_node:
  ros__parameters:
    model_path: /workspaces/isaac_ros-dev/src/ml_models/dock/dock_bev_better.engine
    conf: 0.5
    iou: 0.7
    agnostic_nms: true
    activate_on_start: false
    input_image_topic: /asv5/bev
    output_detections_topic: /asv5/bev/yolo/detections
    output_annotations_topic: /asv5/bev/yolo/annotations


# Dock window (light tower) detection, pose and light sequence.
/**/dockwin_yolo_node:
  ros__parameters:
    model_path: /workspaces/isaac_ros-dev/src/ml_models/dockwin/dockwin_real_051026.engine
    conf: 0.4
    iou: 0.6
    agnostic_nms: true
    # Starts inactive; activate via /asv5/dockwin/manage_nodes.
    activate_on_start: false
    input_image_topic: /asv5/oakd/rgb/image_raw
    output_detections_topic: yolo/detections
    output_annotations_topic: yolo/annotations

/**/dockwin_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /asv5/oakd/rgb/camera_info
    is_image_rectified: false
    object_frame_id: dockwin/yolo
    input_detections_topic: yolo/detections
    input_depth_image_topic: /asv5/oakd/stereo/image_raw
    use_depth_image: true
    depth_sync_slop: 1.0
    mask_erosion_iters: 2
    min_depth: 0.2
    max_depth: 15.0
    estimation_method: improved
    max_reprojection_error: 8.0
    min_inliers: 4
    depth_filter_alpha: 1.0
    min_confidence: 0.35

/**/dockwin_sequence_decoder_node:
  ros__parameters:
    input_detections_topic: yolo/detections
    output_sequence_topic: dockwin/light_sequence
    service_name: /asv5/task_status_update
    min_confidence: 0.25
    pulse_duration_min: 0.5
    pulse_duration_max: 1.5
    delimiter_duration_min: 1.5
    debounce_duration: 0.15
    spatial_tolerance_px: 150.0
    adaptive_tolerance_factor: 0.70
    min_tolerance_px: 15.0
    aspect_ratio_min: 0.45
    aspect_ratio_max: 1.15
    activate_on_start: false

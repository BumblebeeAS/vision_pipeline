# Pipeline nodes
/**/slalom_yolo_node:
  ros__parameters:
    model_name: yolov11s_slalom_20250607_0.engine
    conf: 0.25
    iou: 0.7
    agnostic_nms: true
    input_image_topic: color/image/orin
    output_detections_topic: slalom/yolo/detections
    output_image_topic: slalom/yolo/image
/**/slalom_depth_anything_node:
  ros__parameters:
    model_path: /workspaces/isaac_ros-dev/src/depth_anything_ros2_trt/data/depth_anything_v2_vitb.engine
    precision: fp16
/**/slalom_pose_estimator_node:
  ros__parameters:
    camera_info_topic: color/camera_info
    input_detections_topic: slalom/yolo/detections
    input_depth_image_topic: slalom/depth/image
    output_pose_topic: /auv4/slalom/pose

# Visualization nodes
/**/slalom_depth_to_rgb_node:
  ros__parameters:
    input_image_topic: slalom/depth/image
    output_image_topic: slalom/depth/color/image
/**/slalom_yolo_compression_node:
  ros__parameters:
    out.jpeg_quality: 50
/**/slalom_depth_compression_node:
  ros__parameters:
    out.jpeg_quality: 50

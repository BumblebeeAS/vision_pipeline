/**/torpedo_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /auv4/front_cam/color/camera_info
    object_frame_id: torpedo/yolo
    input_detections_topic: torpedo/yolo/detections
/**/torpedo_hole_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /auv4/front_cam/color/camera_info
    input_detections_topic: torpedo/symbols/yolo/detections
    top_left_frame_id: torpedo/hole/top_left
    top_right_frame_id: torpedo/hole/top_right
    bottom_left_frame_id: torpedo/hole/bottom_left
    bottom_right_frame_id: torpedo/hole/bottom_right

# Shared-shift board-pose variant (one rigid board pose from all visible holes).
# Distinct frame_ids so it can run alongside the per-hole node for A/B.
/**/torpedo_hole_board_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /auv4/front_cam/color/camera_info
    input_detections_topic: torpedo/symbols/yolo/detections
    top_left_frame_id: torpedo/hole_board/top_left
    top_right_frame_id: torpedo/hole_board/top_right
    bottom_left_frame_id: torpedo/hole_board/bottom_left
    bottom_right_frame_id: torpedo/hole_board/bottom_right
    # --- detection front-end ---
    # Ellipse fit method for hole rims ("direct" | "ransac" ...); matches the
    # per-hole node's front-end.
    ellipse_fit_method: direct
    # --- full 6-DoF joint solve knobs (>=2 full, or 1 full + partial) ---
    # n_slots = angular binning resolution (360/n deg per slot) for rim<->ring
    # correspondence; 72 (5 deg/slot) avoids the clocking-quantization aliasing
    # that made 36 erratic at a few degrees of roll.
    n_slots: 90
    # max_rms_px = prev-pose track-accept + warn threshold (NOT a publish gate;
    # the joint solve publishes whatever its rms).
    max_rms_px: 6.0
    # one_full_max_rms_px = acceptance gate on the 1-full translation-only
    one_full_max_rms_px: 20.0
    # joint_max_rms_px = acceptance gate on EVERY joint 6-DoF solve (>=2-full
    # and 1-full+partial alike). Above it the joint pose is discarded (hold
    # cached, or skip at cold start) rather than cached -- catches both a
    # mislabeled lone hole sliding meters onto the wrong quadrant AND a
    # mislabeled/fake-hole 4-hole frame "solving" at 100px+ and poisoning the
    # cache. Honest joint solves run <10px on real masks.
    joint_max_rms_px: 15.0
    # icp_iters = correspondence-refinement iterations after the IPPE estimate.
    icp_iters: 7
    # --- ternary visibility gate (on arc_frac, the per-hole node's metric) ---
    # >= full_arc_frac -> "full" (rim shape -> tilt); between the two (sane fit)
    # -> "partial" (center only -> yaw); below partial_arc_frac -> skipped.
    full_arc_frac: 0.7
    partial_arc_frac: 0.4
    # --- output ---
    # publish_full_rotation: true = real pitch/roll/yaw; false = yaw-only snap.
    # 1-full frames hold the last rotation and update translation only.
    publish_full_rotation: false
    publish_twin_debug: false

/**/lifecycle_manager_node:
  ros__parameters:
    node_names:
      - torpedo_vision_node
    wait_timeout_sec: 1.0


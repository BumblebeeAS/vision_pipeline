# Single multi-model YOLO node: one subscription + one decode feeding both
# models. `symbols` runs in track mode and emits the `torpedo` (board) and
# `hole` classes; `board` runs in plain predict mode. Output topics are
# unchanged from the old two-node setup, so the pose estimators below are
# untouched. display_tracker_id is shared across models but only affects
# `symbols` (predict-mode detections carry no track IDs).
/**/torpedo_vision_node:
  ros__parameters:
    input_image_topic: /auv4/front_cam/color/image
    display_tracker_id: true
    models:
      - symbols
      - board
    symbols.model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_torpedo_symbols_20260704.engine
    symbols.conf: 0.25
    symbols.iou: 0.7
    symbols.agnostic_nms: true
    symbols.detections_topic: torpedo/symbols/yolo/detections
    symbols.annotations_topic: torpedo/symbols/yolo/annotations
    symbols.mode: track
    symbols.tracker: bytetrack.yaml
    board.model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_torpedo_board_20260716.engine
    board.conf: 0.25
    board.iou: 0.7
    board.agnostic_nms: true
    board.detections_topic: torpedo/yolo/detections
    board.annotations_topic: torpedo/yolo/annotations


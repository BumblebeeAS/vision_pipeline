# Pipeline nodes
/**/slalom_yolo_node:
  ros__parameters:
    model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_slalom_20260713.engine
    # model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov11_segment/yolov11s_slalom_20250812_0.engine
    conf: 0.25
    iou: 0.7
    agnostic_nms: true
    input_image_topic: /auv5/front_cam/color/image
    output_detections_topic: slalom/yolo/detections
    output_annotations_topic: slalom/yolo/annotations
/**/slalom_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /auv5/front_cam/color/camera_info
    is_image_rectified: true
    input_detections_topic: slalom/yolo/detections
    input_depth_image_topic: depth/image
    object_frame: slalom_layer
    max_reprojection_error: 10.0
/**/slalom_pose_estimator_near_node:
  ros__parameters:
    camera_info_topic: /auv5/front_cam/color/camera_info
    is_image_rectified: true
    input_detections_topic: slalom/yolo/detections
    input_depth_image_topic: depth/image
    object_frame: slalom_layer_near
    max_reprojection_error: 100.0
/**/slalom_structure_pf_node:
  ros__parameters:
    detections_topic: slalom/yolo/detections
    input_odom_topic: /auv5/nav/odom_ned
    camera_info_topic: /auv5/front_cam/color/camera_info
    is_image_rectified: true
    pole_height_m: 0.9144
    # Center-to-center within-layer pole spacing (m): 1.524 = 5 ft,
    # measured on the structure. Half of it (0.762) is the mid-channel
    # pass-by offset in mission_planner_2's grouped_tfs.yaml -- keep in sync.
    pole_spacing: 1.524
    layer_distance: 2.0
    yaw_half_range_deg: 45.0
    sigma_pole: 0.15
    pf_n_particles: 2000
/**/slalom_lifecycle_manager_node:
  ros__parameters:
    node_names:
      - slalom_yolo_node
    wait_timeout_sec: 1.0
# Visualization nodes
/**/slalom_depth_to_rgb_node:
  ros__parameters:
    input_image_topic: depth/image
    output_image_topic: depth/color/image
/**/slalom_depth_compression_node:
  ros__parameters:
    in_transport: raw
    out_transport: compressed
    .out.compressed.jpeg_quality: 50

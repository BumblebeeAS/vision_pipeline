# YOLO nodes
# bin + lightbox share bot_cam/color/image; run them in ONE node (multi_yolo_node,
# same pattern as gate_vision_node) so the frame is decoded once instead of twice.
/**/bin_vision_node:
  ros__parameters:
    input_image_topic: /auv5/bot_cam/color/image
    models:
      - bin
      - lightbox
      - lightbox_faceplate
    bin.model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_bins_20260712.engine
    bin.conf: 0.25
    bin.iou: 0.7
    bin.agnostic_nms: true
    bin.detections_topic: bin/yolo/detections
    bin.annotations_topic: bin/yolo/annotations
    lightbox.model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_binz_20260713.engine
    lightbox.conf: 0.25
    lightbox.iou: 0.7
    lightbox.agnostic_nms: true
    lightbox.detections_topic: lightbox/yolo/detections
    lightbox.annotations_topic: lightbox/yolo/annotations
    lightbox_faceplate.model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_faceplate_color_new_20260713.engine
    lightbox_faceplate.conf: 0.25
    lightbox_faceplate.iou: 0.7
    lightbox_faceplate.agnostic_nms: true
    lightbox_faceplate.detections_topic: light_box/face_plate/yolo/detections
    lightbox_faceplate.annotations_topic: light_box/face_plate/yolo/annotations
# /**/light_box_face_plate_yolo_node:
#   ros__parameters:
#     model_path: /workspaces/isaac_ros-dev/src/ml_models/yolov26_segment/yolov26_lightbox_bottom_faceplate_20260706.engine

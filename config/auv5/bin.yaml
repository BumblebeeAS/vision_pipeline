/**/bin_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /auv5/bot_cam/color/camera_info
    object_frame_id: bin/yolo
    input_detections_topic: bin/yolo/detections
/**/light_box_pose_estimator_node:
  ros__parameters:
    camera_info_topic: /auv5/bot_cam/color/camera_info
    input_detections_topic: /auv5/bin/light_box/face_plate/yolo/detections
# /**/light_box_triangulation_pose_estimator_node:
#   ros__parameters:
#     camera_info_topic: /auv5/bot_cam/color/camera_info
#     input_detections_topic: bin/yolo/detections
#     input_odom_topic: /auv5/nav/odom_ned
#     light_box_frame_id: bin/light_box/triangulated
/**/bin_structure_pf_node:
  ros__parameters:
    camera_info_topic: /auv5/bot_cam/color/camera_info
    input_odom_topic: /auv5/nav/odom_ned
    # Structure detections ('bin' rim + 'lightbox', the lightbox_bottom
    # model) drive the filter: every detection is PnP'd. The symbol topic
    # ('fire'/'blood', the bins model) is never PnP'd -- the bin walls
    # occlude the symbols from oblique views -- it only tags rim points
    # by mask intersection for the blood/fire identity posterior.
    structure_detections_topic: lightbox/yolo/detections
    symbol_detections_topic: bin/yolo/detections
    # Measured structure geometry, FLU mm, bin 1 = origin (anchor).
    # Row-major triplets; converted to NED meters in the node.
    bin_positions_flu_mm: [0.0, 0.0, 0.0, 237.63, -394.46, 33.86, 692.73, 226.31, 69.30, 910.21, -168.15, 270.89]
    light_box_positions_flu_mm: [-278.56, -381.89, -34.37, 1171.25, 213.74, 371.50]
/**/lifecycle_manager_node:
  ros__parameters:
    node_names:
      - bin_vision_node
    wait_timeout_sec: 1.0
